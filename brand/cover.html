<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mechanic Do — cover</title>
<!-- Google Business Profile cover. Rendered to cover.png (2160x1216, i.e. 1080x608 at 2x).
     Reuses the site's stylesheet, fonts and the drive-train elevation from index.html. -->
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 608px; overflow: hidden; }
  body::before, body::after { display: none !important; }
  .cv {
    position: relative; width: 1080px; height: 608px; box-sizing: border-box; overflow: hidden;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-2) 1px, transparent 1px),
      linear-gradient(var(--grid-1) 1px, transparent 1px), linear-gradient(90deg, var(--grid-1) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    font-family: var(--f-sans); color: var(--ink);
    padding: 40px 56px 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 850; font-stretch: 122%; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
  .brand i { width: 16px; height: 2px; background: var(--red); display: block; }
  .brand b { display: grid; place-items: center; width: 38px; height: 38px; border: 2.5px solid var(--red); border-radius: 50%; color: var(--red); font-size: 15px; font-stretch: 105%; text-transform: none; }
  .eyebrow { margin: 22px 0 10px; font: 600 13px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }
  h1.hl { margin: 0; max-width: 640px; font-weight: 850; font-stretch: 112%; font-size: 48px; line-height: 1.02; letter-spacing: -.03em; }
  .svc { margin: 18px 0 0; font: 600 13px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .svc span { color: var(--red-ink); }
  .plate {
    position: absolute; top: 40px; right: 56px; width: 300px; box-sizing: border-box;
    background: var(--blue); color: var(--on-blue); padding: 22px 24px;
    box-shadow: 7px 7px 0 -2px var(--paper), 7px 7px 0 0 var(--ink);
    background-image: linear-gradient(rgba(241,245,250,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(241,245,250,.07) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .plate .k { margin: 0 0 6px; font: 600 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--on-blue-2); }
  .plate .v { margin: 0 0 16px; font-weight: 800; font-stretch: 110%; font-size: 26px; line-height: 1.1; }
  .plate .v:last-child { margin-bottom: 0; }
  .plate .red { color: var(--red-lt); }
  .draw { position: absolute; left: 72px; right: 72px; bottom: 44px; }
  .draw .ga__svg { width: 100%; height: auto; display: block; }
  .strip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: var(--blue); color: var(--on-blue);
    display: flex; align-items: center; justify-content: space-between; padding: 0 56px;
    font: 600 12px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase;
  }
</style></head><body>
