<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mechanic Do — logo</title>
<!-- Google Business Profile logo. Rendered to logo.png (1080x1080). Google often crops
     logos to a circle, so everything important sits inside the central circle. -->
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  html, body { margin: 0; padding: 0; width: 720px; height: 720px; overflow: hidden; background: none; }
  body::before, body::after { display: none !important; }
  .tile {
    position: relative; width: 720px; height: 720px; box-sizing: border-box;
    background-color: #0f3c69;
    background-image:
      linear-gradient(rgba(241,245,250,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(241,245,250,.13) 1px, transparent 1px),
      linear-gradient(rgba(241,245,250,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(241,245,250,.05) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    background-position: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #f1f5fa; font-family: var(--f-sans);
  }
  .word { font-weight: 850; font-stretch: 122%; font-size: 74px; letter-spacing: .01em; line-height: 1; text-transform: uppercase; margin: 0; }
  .leader { width: 3px; height: 46px; background: #ff9a85; position: relative; margin-top: 18px; }
  .leader::before { content: ""; position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #ff9a85; }
  .ball {
    width: 250px; height: 250px; border-radius: 50%; border: 12px solid #ff9a85; box-sizing: border-box;
    display: grid; place-items: center;
    font-weight: 850; font-stretch: 112%; font-size: 124px; letter-spacing: -.02em; color: #f1f5fa; line-height: 1;
    padding-bottom: 10px;
  }
  .tag { margin: 30px 0 0; font: 600 21px/1 var(--f-mono); letter-spacing: .26em; text-transform: uppercase; color: #b9cde3; padding-left: .26em; }
</style></head><body>
<div class="tile">
  <p class="word">Mechanic</p>
  <span class="leader" aria-hidden="true"></span>
  <div class="ball">Do</div>
  <p class="tag">Millwright services</p>
</div>
</body></html>
