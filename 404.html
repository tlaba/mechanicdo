<!--
  Deliberately self-contained: no external CSS, JS, or images.
  GitHub Pages serves this file for any missing path, including deep ones
  like /some/made/up/path/, where relative asset links would break — and
  root-absolute links (/assets/...) break on a project site served from
  /mechanicdo/. Inlining everything keeps it correct at every URL.
-->
<style>

  body {

    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  .sheet { width: 100%; max-width: 620px; background: #faf9f5; border: 2px solid #12171d; box-shadow: 8px 8px 0 -2px #faf9f5, 8px 8px 0 0 #12171d; }
  .strip { background: #0f3c69; color: #f1f5fa; font: 600 .72rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; padding: .75rem 1.2rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .body { padding: clamp(1.5rem, 5vw, 2.6rem); }
  .brand { display: inline-flex; align-items: center; gap: .45rem; text-decoration: none; color: #12171d; font-weight: 850; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 1.8rem; }

  p { color: #38424d; margin: 0 0 1.8rem; }

<script>
  // On a GitHub project site the homepage is /<repo>/, not /. Point the
  // "home" links at the right place without hard-coding the repo name, so
  // this keeps working after a move to a custom domain at the root.
  (function () {
    var host = location.hostname;
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(host) && seg) {
      var home = '/' + seg + '/';
      var links = document.querySelectorAll('[data-home]');
      for (var i = 0; i < links.length; i++) links[i].setAttribute('href', home);
    }
  })();
</script>
